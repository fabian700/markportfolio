<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      const appBase = '/markportfolio'
      const path = window.location.pathname.startsWith(appBase)
        ? window.location.pathname.slice(appBase.length)
        : '/'
      const route = `${path || '/'}${window.location.search}${window.location.hash}`
      window.location.replace(`${appBase}/?p=${encodeURIComponent(route)}`)
    </script>
  </head>
  <body></body>
</html>
