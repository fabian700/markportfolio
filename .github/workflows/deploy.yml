name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Set absolute Open Graph URLs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const owner = process.env.GITHUB_REPOSITORY_OWNER
          const repository = process.env.GITHUB_REPOSITORY.split('/').pop()
          const siteUrl = `https://${owner}.github.io/${repository}/`
          const imageUrl = new URL('georgina-mark-id-card.png', siteUrl).href
          const html = readFileSync('dist/index.html', 'utf8')
            .replace(/(<meta property="og:url" content=")[^"]+/, (_, prefix) => prefix + siteUrl)
            .replace(/(<meta property="og:image" content=")[^"]+/, (_, prefix) => prefix + imageUrl)

          writeFileSync('dist/index.html', html)
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
